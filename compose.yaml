name: mysticatlas
services:
  app:
    build: .
    image: mysticatlas:local
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${MYSTICATLAS_PORT:-3000}:3000'
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-2}
      AI_RATE_PER_HOUR: ${AI_RATE_PER_HOUR:-10}
      AI_REQUEST_BUDGET: ${AI_REQUEST_BUDGET:-100}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
    stop_grace_period: 20s
